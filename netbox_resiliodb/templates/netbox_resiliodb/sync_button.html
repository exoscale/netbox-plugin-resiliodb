{% load static %}

<button type="button" 
        class="btn btn-primary" 
        id="resilio-sync-button"
        onclick="triggerSync()">
    <i class="mdi mdi-sync"></i> Sync with ResilioDB
</button>

<script>
function triggerSync() {
    const button = document.getElementById('resilio-sync-button');
    button.disabled = true;
    button.innerHTML = '<i class="mdi mdi-sync mdi-spin"></i> Sync in progress...';

    fetch('/api/plugins/resiliodb/device-sync/sync/', {
        method: 'POST',
        headers: {
            'X-CSRFToken': '{{ csrf_token }}',
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({
            device_id: '{{ object.id }}'
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'started' || data.status === 'running') {
            pollSyncStatus();
        }
    })
    .catch(error => {
        console.error('Error:', error);
        button.disabled = false;
        button.innerHTML = '<i class="mdi mdi-sync"></i> Sync with ResilioDB';
    });
}

function pollSyncStatus() {
    const button = document.getElementById('resilio-sync-button');
    
    fetch('/api/plugins/resiliodb/device-sync/status/')
        .then(response => response.json())
        .then(data => {
            if (data.status === 'idle') {
                button.disabled = false;
                button.innerHTML = '<i class="mdi mdi-sync"></i> Sync with ResilioDB';
            } else {
                button.disabled = true;
                button.innerHTML = '<i class="mdi mdi-sync mdi-spin"></i> Sync in progress...';
                setTimeout(pollSyncStatus, 2000);
            }
        });
}

// Check initial sync status on page load
fetch('/api/plugins/resiliodb/device-sync/status/')
    .then(response => response.json())
    .then(data => {
        if (data.status === 'running') {
            const button = document.getElementById('resilio-sync-button');
            button.disabled = true;
            button.innerHTML = '<i class="mdi mdi-sync mdi-spin"></i> Sync in progress...';
            pollSyncStatus();
        }
    });
</script>
