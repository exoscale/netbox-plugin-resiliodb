{% load helpers %} {% load i18n %}
<div class="card mb-3">
    <h5 class="card-header">{% trans "LCA Footprint" %}</h5>
    <div class="card-body">
        {% if object.lca_impact_data %}
        <canvas id="lcaChart"></canvas>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script>
            const ctx = document.getElementById('lcaChart');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: [
                        {% for value in object.lca_impact_data.indicator_values.all %}
                            {% if value.indicator.code in 'ADPe,ADPf,AP,GWP,IR,PM,WU'|split:',' %}
                                '{{ value.indicator.code }}',
                            {% endif %}
                        {% endfor %}
                    ],
                    datasets: [
                        {
                            label: 'EOL',
                            data: [
                                {% for value in object.lca_impact_data.indicator_values.all %}
                                    {% if value.indicator.code in 'ADPe,ADPf,AP,GWP,IR,PM,WU'|split:',' %}
                                        {% with total=value.EOL|default:0|add:value.USE|default:0|add:value.DIS|default:0|add:value.BLD|default:0 %}
                                            {{ value.EOL|default:0|divisibleby:total }},
                                        {% endwith %}
                                    {% endif %}
                                {% endfor %}
                            ],
                            _raw_data: [
                                {% for value in object.lca_impact_data.indicator_values.all %}
                                    {% if value.indicator.code in 'ADPe,ADPf,AP,GWP,IR,PM,WU'|split:',' %}
                                        {{ value.EOL|default:0 }},
                                    {% endif %}
                                {% endfor %}
                            ],
                            backgroundColor: '#76B947'
                        },
                        {
                            label: 'USE',
                            data: [
                                {% for value in object.lca_impact_data.indicator_values.all %}
                                    {% if value.indicator.code in 'ADPe,ADPf,AP,GWP,IR,PM,WU'|split:',' %}
                                        {% with total=value.EOL|default:0|add:value.USE|default:0|add:value.DIS|default:0|add:value.BLD|default:0 %}
                                            {{ value.USE|default:0|divisibleby:total }},
                                        {% endwith %}
                                    {% endif %}
                                {% endfor %}
                            ],
                            _raw_data: [
                                {% for value in object.lca_impact_data.indicator_values.all %}
                                    {% if value.indicator.code in 'ADPe,ADPf,AP,GWP,IR,PM,WU'|split:',' %}
                                        {{ value.USE|default:0 }},
                                    {% endif %}
                                {% endfor %}
                            ],
                            backgroundColor: '#2E5520'
                        },
                        {
                            label: 'DIS',
                            data: [
                                {% for value in object.lca_impact_data.indicator_values.all %}
                                    {% if value.indicator.code in 'ADPe,ADPf,AP,GWP,IR,PM,WU'|split:',' %}
                                        {% with total=value.EOL|default:0|add:value.USE|default:0|add:value.DIS|default:0|add:value.BLD|default:0 %}
                                            {{ value.DIS|default:0|divisibleby:total }},
                                        {% endwith %}
                                    {% endif %}
                                {% endfor %}
                            ],
                            _raw_data: [
                                {% for value in object.lca_impact_data.indicator_values.all %}
                                    {% if value.indicator.code in 'ADPe,ADPf,AP,GWP,IR,PM,WU'|split:',' %}
                                        {{ value.DIS|default:0 }},
                                    {% endif %}
                                {% endfor %}
                            ],
                            backgroundColor: '#FFF4BD'
                        },
                        {
                            label: 'BLD',
                            data: [
                                {% for value in object.lca_impact_data.indicator_values.all %}
                                    {% if value.indicator.code in 'ADPe,ADPf,AP,GWP,IR,PM,WU'|split:',' %}
                                        {% with total=value.EOL|default:0|add:value.USE|default:0|add:value.DIS|default:0|add:value.BLD|default:0 %}
                                            {{ value.BLD|default:0|divisibleby:total }},
                                        {% endwith %}
                                    {% endif %}
                                {% endfor %}
                            ],
                            _raw_data: [
                                {% for value in object.lca_impact_data.indicator_values.all %}
                                    {% if value.indicator.code in 'ADPe,ADPf,AP,GWP,IR,PM,WU'|split:',' %}
                                        {{ value.BLD|default:0 }},
                                    {% endif %}
                                {% endfor %}
                            ],
                            backgroundColor: '#FFED83'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: {
                            stacked: true
                        },
                        y: {
                            stacked: true,
                            beginAtZero: true,
                            min: 0,
                            max: 1,
                            ticks: {
                                format: {
                                    style: 'percent'
                                }
                            }
                        }
                    },
                    plugins: {
                        title: {
                            display: true,
                            text: 'Environmental Impact Distribution by Life Cycle Step'
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const datasetLabel = context.dataset.label;
                                    const value = context.raw;
                                    const total = context.dataset._total;
                                    const percentage = ((value / total) * 100).toFixed(1);
                                    return `${datasetLabel}: ${value.toFixed(3)} (${percentage}%)`;
                                }
                            }
                        }
                    }
                }
            });
        </script>
        {% else %}
        <span class="text-muted">No LCA impact data available</span>
        {% endif %}
    </div>
</div>
